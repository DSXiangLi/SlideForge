<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MCP Apps 宿主模拟器（harness）</title>
<style>
  body { margin:0; background:#14161a; color:#c9d1d9; font:13px/1.5 system-ui, sans-serif; }
  #bar { padding:6px 10px; border-bottom:1px solid #2a2f38; }
  #view { width:100%; height:900px; border:0; background:#0b0d10; }
</style>
</head>
<body>
<div id="bar">MCP Apps 宿主模拟器 — <span id="state">idle</span></div>
<iframe id="view" sandbox="allow-scripts" title="view"></iframe>
<script>/* 沙箱属性在下方脚本里按 ?sandbox= 覆写（见 SANDBOX_ATTR） */</script>
<script>
/* ============================================================
   MCP Apps 宿主模拟器（harness 专用，非产品代码）

   复刻 SproutHarness 的关键约束，用于在没有真实宿主的情况下验收轨 A：
   - iframe sandbox 只有 allow-scripts（不透明源：无 localStorage/indexedDB/cookie）；
   - 按宿主默认 CSP 注入 <meta http-equiv="Content-Security-Policy">（与 build_csp_header({}) 同形）；
   - iframe 里注进 View HTML（srcdoc），postMessage JSON-RPC 2.0 与 View 通信；
   - tools/call 交给页面外注入的 window.mcpCall（Playwright 用 expose_function 提供），
     即"宿主代理"到 daemon；
   - 两阶段拆卸：先发 ui/resource-teardown 请求，等 View 回执（≤5s）才置 torn-down。

   暴露 window.hostSim 供测试断言；自身异常写进 hostSim.errors（不静默）。
   ============================================================ */
(function(){
  var params = new URLSearchParams(location.search);
  var viewUrl = params.get('view') || 'view.html';
  var useCsp = params.get('csp') !== '0';
  /* 沙箱形态——与宿主配置一一对应（SproutHarness `mcp.apps.allow_same_origin`）：
     - trusted（默认）：`allow-scripts allow-same-origin` ← 宿主 `allow_same_origin: true`；
       View 有真实源，嵌套渲染文档可访问（完整能力）；
     - host：`allow-scripts` ← 宿主默认（false），不透明源，View 取不到嵌套文档。
     兼容旧参数名 `spec`（== trusted）。见 docs/design/mcp-apps-upgrade.md §10.10。 */
  var sandboxArg = params.get('sandbox') || 'trusted';
  var sandboxMode = sandboxArg === 'host' ? 'host' : 'trusted';
  var SANDBOX_ATTR = sandboxMode === 'trusted' ? 'allow-scripts allow-same-origin' : 'allow-scripts';
  var CSP = "default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data:; " +
            "img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; " +
            "connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'";

  var sim = window.hostSim = {
    state: 'idle', errors: [], inbound: [], toolCalls: [], modelContext: [], messages: [],
    downloads: [], links: [], logs: [], sizes: [], teardownRequests: 0, toolResultSent: false,
    hostContextCalls: 0
  };
  var iframe = document.getElementById('view');
  iframe.setAttribute('sandbox', SANDBOX_ATTR);
  var stateEl = document.getElementById('state');
  var nextId = 1;
  var pending = {};

  function setState(next){ sim.state = next; stateEl.textContent = next; }
  function post(msg){ iframe.contentWindow.postMessage(msg, '*'); }
  function respond(id, result){ post({jsonrpc:'2.0', id:id, result:result}); }
  function respondError(id, code, message){ post({jsonrpc:'2.0', id:id, error:{code:code, message:message}}); }
  function notify(method, params){ post({jsonrpc:'2.0', method:method, params:params || {}}); }
  function request(method, params2, timeoutMs){
    var id = 'host-' + (nextId++);
    return new Promise(function(resolve, reject){
      pending[id] = {resolve:resolve, reject:reject};
      post({jsonrpc:'2.0', id:id, method:method, params:params2 || {}});
      setTimeout(function(){
        if (pending[id]){ delete pending[id]; reject(new Error(method + ' 未在 ' + timeoutMs + 'ms 内应答')); }
      }, timeoutMs || 5000);
    });
  }

  var HOST_INFO = {name:'mcp-apps-host-sim', version:'1.0.0'};
  var HOST_CAPABILITIES = {
    serverTools:{}, serverResources:{}, logging:{}, openLinks:{},
    downloadFile:{}, message:{text:{}}, updateModelContext:{text:{}}
  };
  var HOST_CONTEXT = {
    theme:'dark', displayMode:'inline', availableDisplayModes:['inline'],
    containerDimensions:{maxHeight:1200}, locale:'zh-CN', timeZone:'Asia/Shanghai',
    platform:'web', userAgent:'MCPAppsHostSim/1.0'
  };

  window.addEventListener('message', function(event){
    if (event.source !== iframe.contentWindow) return;
    var msg = event.data;
    if (!msg || msg.jsonrpc !== '2.0') return;
    /* 先认我方请求的应答（应答没有 method），再处理 View 的请求/通知 */
    if (msg.id != null && pending[msg.id]){
      var waiter = pending[msg.id]; delete pending[msg.id];
      if (msg.error) waiter.reject(new Error(msg.error.message || 'host request failed'));
      else waiter.resolve(msg.result);
      return;
    }
    if (typeof msg.method !== 'string') return;
    sim.inbound.push(msg.method);
    switch (msg.method){
      case 'ui/initialize':
        setState('initializing');
        respond(msg.id, {protocolVersion:'2026-01-26', hostInfo:HOST_INFO,
                         hostCapabilities:HOST_CAPABILITIES, hostContext:HOST_CONTEXT});
        break;
      case 'ui/notifications/initialized':
        setState('initialized');
        break;
      case 'tools/call':
        handleToolCall(msg);
        break;
      case 'ui/message':
        sim.messages.push(msg.params); respond(msg.id, {}); break;
      case 'ui/update-model-context':
        sim.modelContext.push(msg.params); respond(msg.id, {}); break;
      case 'ui/open-link':
        sim.links.push(msg.params && msg.params.url); respond(msg.id, {}); break;
      case 'ui/download-file':
        sim.downloads.push(msg.params); respond(msg.id, {}); break;
      case 'ui/notifications/size-changed':
        sim.sizes.push(msg.params); break;
      case 'notifications/message':
        sim.logs.push(msg.params); break;
      case 'ui/notifications/tool-input':
      case 'ui/notifications/tool-input-partial':
        break;
      default:
        if (msg.id != null) respondError(msg.id, -32601, 'method not found: ' + msg.method);
    }
  });

  function handleToolCall(msg){
    var call = msg.params || {};
    var args = call.arguments || {};
    sim.toolCalls.push({name:call.name, arguments:args});
    if (typeof window.mcpCall !== 'function'){
      respondError(msg.id, -32000, '宿主代理未注入（window.mcpCall 缺失）');
      return;
    }
    Promise.resolve(window.mcpCall(String(call.name), JSON.stringify(args))).then(function(text){
      text = String(text == null ? '' : text);
      var isError = /^Error executing tool /.test(text);
      respond(msg.id, {content:[{type:'text', text:text}], isError:isError});
    }).catch(function(err){
      respond(msg.id, {content:[{type:'text', text:String((err && err.message) || err)}], isError:true});
    });
  }

  /* 宿主 → View：工具生命周期通知 */
  sim.sendToolInput = function(args){ notify('ui/notifications/tool-input', {arguments:args || {}}); };
  sim.sendToolResult = function(payload){
    var text = (typeof payload === 'string') ? payload : JSON.stringify(payload);
    notify('ui/notifications/tool-result', {content:[{type:'text', text:text}]});
    sim.toolResultSent = true;
  };
  sim.sendHostContext = function(ctx){ notify('ui/notifications/host-context-changed', ctx || {}); };
  /* 两阶段拆卸：宿主等 View 回执；View 必须在回执前把草稿落盘 */
  sim.requestTeardown = function(timeoutMs){
    return sim.teardownWithTimeout(timeoutMs || 5000);
  };
  sim.teardownWithTimeout = function(timeoutMs){
    sim.teardownRequests++;
    return request('ui/resource-teardown', {}, timeoutMs || 5000).then(function(){
      setState('torn-down'); return true;
    });
  };
  sim.reloadView = function(){ return loadView(); };
  sim.start = function(payload){
    return loadView().then(function(){ if (payload) sim.sendToolResult(payload); return true; });
  };

  function loadView(){
    setState('loading');
    return fetch(viewUrl, {cache:'no-store'}).then(function(res){
      if (!res.ok) throw new Error('view fetch HTTP ' + res.status);
      return res.text();
    }).then(function(html){
      if (useCsp && html.indexOf('Content-Security-Policy') < 0){
        html = html.replace(/<head([^>]*)>/i,
          '<head$1><meta http-equiv="Content-Security-Policy" content="' + CSP.replace(/"/g, '&quot;') + '">');
      }
      iframe.setAttribute('srcdoc', html);
      return true;
    }).catch(function(err){
      sim.errors.push(String(err));
      setState('error');
      throw err;
    });
  }

  /* 自启动：装载 View（工具输入/结果由测试显式下发，便于断言顺序） */
  loadView().catch(function(){});
})();
</script>
</body>
</html>
