<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Phase6 Batch3 · A/B 灰度盲测</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0e1014;font-family:"PingFang SC","Noto Sans SC",sans-serif;color:#e8ebf0}
.wrap{padding:30px 0 80px}
.hd{text-align:center;margin-bottom:8px;font-size:22px;font-weight:600}
.sub{color:#8b93a3;text-align:center;margin-bottom:28px;font-size:13px;line-height:1.7}
.group{margin:0 auto 40px;max-width:1920px}
.group-hd{color:#dbe0ea;font-size:16px;font-weight:600;margin-bottom:12px;padding-left:4px}
.row{display:flex;gap:12px;justify-content:center}
.cell{flex:none}
.cell-lbl{color:#9aa3b4;font-size:12px;letter-spacing:.06em;margin-bottom:6px;text-align:center}
.img-wrap{width:480px;height:270px;overflow:hidden;border:1px solid #2a2e36}
.img-wrap img{width:1920px;height:1080px;transform:scale(.25);transform-origin:top left;filter:grayscale(100%) contrast(1.1)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">Phase 6 · 批次 3 · 灰度盲测</div>
  <div class="sub">4 套主题 × 4 页型 = 16 页，去色灰度 + 缩略图并排。<br>遮住主题名后，能否从灰度结构辨认出每套主题的 signature_operator？</div>

  <div class="group">
    <div class="group-hd">页型：cover</div>
    <div class="row">
      <div class="cell">
        <div class="cell-lbl">G4 靛墨黄页</div>
        <div class="img-wrap"><img src="png/g4-cover.png" alt="g4-cover"></div>
      </div>
      <div class="cell">

        <div class="img-wrap"><img src="png/g5-cover.png" alt="g5-cover"></div>
      </div>
      <div class="cell">
        <div class="cell-lbl">E2 蓝图</div>
        <div class="img-wrap"><img src="png/e2-cover.png" alt="e2-cover"></div>

      <div class="cell">
        <div class="cell-lbl">E3 装饰艺术</div>
        <div class="img-wrap"><img src="png/e3-cover.png" alt="e3-cover"></div>
      </div>
    </div>
  </div>
  <div class="group">
    <div class="group-hd">页型：claim</div>
    <div class="row">
      <div class="cell">
        <div class="cell-lbl">G4 靛墨黄页</div>
        <div class="img-wrap"><img src="png/g4-claim.png" alt="g4-claim"></div>
      </div>
      <div class="cell">
        <div class="cell-lbl">G5 三色旬刊</div>
        <div class="img-wrap"><img src="png/g5-claim.png" alt="g5-claim"></div>
      </div>
      <div class="cell">
        <div class="cell-lbl">E2 蓝图</div>
        <div class="img-wrap"><img src="png/e2-claim.png" alt="e2-claim"></div>

        <div class="cell-lbl">E3 装饰艺术</div>
        <div class="img-wrap"><img src="png/e3-claim.png" alt="e3-claim"></div>
      </div>
    </div>
  </div>
  <div class="group">
    <div class="group-hd">页型：analysis</div>
    <div class="row">
      <div class="cell">
        <div class="cell-lbl">G4 靛墨黄页</div>
        <div class="img-wrap"><img src="png/g4-analysis.png" alt="g4-analysis"></div>
      </div>
      <div class="cell">
        <div class="cell-lbl">G5 三色旬刊</div>

      </div>

        <div class="cell-lbl">E2 蓝图</div>

        <div class="img-wrap"><img src="png/e3-analysis.png" alt="e3-analysis"></div>

    </div>
